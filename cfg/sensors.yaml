sensors:
  - id: "temp_ambiente"
    alias: "Temperatura"
    label: "Temperatura Ambiental"
    unit: "°C"
  - id: "hum_ambiente"
    alias: "HR"
    label: "Humedad Ambiental"
    unit: "%"
  - id: "hum_suelo"
    alias: "Hum. Suelo"
    label: "Humedad del Suelo"
    unit: "%"
  - id: "lux"
    alias: "Luz"
    label: "Intensidad Lumínica"
    unit: "Lux"
