sensors:
  - id: "temp_ambiente"
    alias: "Temperatura"
    label: "Temperatura Ambiental"
    unit: "°C"
  - id: "hum_ambiente"
    alias: "HR"
    label: "Humedad Ambiental"
    unit: "%"
  - id: "presion_atm"
    alias: "Presión"
    label: "Presión Atmosférica"
    unit: "hPa"
  - id: "resistencia_gas"
    alias: "Gas"
    label: "Resistencia Gas"
    unit: "Ω"
